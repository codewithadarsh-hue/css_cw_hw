<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact</title>
    <style>
        body{
            margin: 0;

        }
        h1{
            position: fixed;
            top:0;
            left: 0;
            width:100%; 
            background-color:rgb(13, 135, 175);
            color: white;
            text-align: center;
            padding: 15px;
            margin: 0;
            
        
        }
        .profile{
            position: relative;
            width: 60%;
            margin: 90px    auto;
            border: solid black 2px;
            padding:20px;
            overflow:auto;
            min-height:300px;
        }
        img{
            float: left;
            width: 200px;
            height:200px;
            margin: auto;
         }      
        .info{      
        text-align:center;
        width:50%;
        margin:auto;            
        letter-spacing: 5px;
        line-height: 30px;

        }
        .contact{       
        position:absolute;
        top:20px;
        right:20px;     
        width:160px;
        border-left: 4px solid black;
        padding-left:30px;
        text-align:center       ;
}       
            


    </style>
</head>
<body>
    <h1>Company Contact Card</h1>
    <div class="profile">
    <img src=https://img.magnific.com/free-vector/blue-circle-with-white-user_78370-4707.jpg?semt=ais_hybrid&w=740&q=80>
    <div class="info"> 
    <h2>Adarsh T</h2>
    <h3>Software developer</h3>
     <p>
            Experienced software developer with a passion for
            creating responsive and user-friendly web applications.
            
        </p>
        <p>Frontend | Backend | Software Testing</p>
    </div>
    <div class="contact">
        <h3>Contact Info</h3>   
        <p class="p1">987654321</p>
        <p class="p2">adarsh@email.com</p>
    </div>
  

</body>
</html>
